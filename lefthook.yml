# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/full_guide.md
#

pre-commit:
  parallel: true
  commands:
    typing:
      glob: '*.{ts}'
      run: pnpm run ts:check

    linting:
      glob: '*.{ts,js}'
      run: pnpm run lint --fix
      stage_fixed: true

    spelling:
      glob: '*.{js,ts,jsx,tsx,md}'
      run: pnpm run cspell {staged_files}

    formatting:
      glob: '*.{js,ts,jsx,tsx,md}'
      run: pnpm run format {staged_files}

    check-deps:
      run: pnpm run check-deps

commit-msg:
  parallel: true
  commands:
    lint-commit-msg:
      run: pnpm run commitlint --edit

    spell-check:
      run: echo "$(cat {1})" | pnpm run cspell stdin --no-summary

pre-push:
  parallel: true
  commands:
    build:
      run: pnpm run build
